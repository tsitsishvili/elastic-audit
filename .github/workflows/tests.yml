name: Tests

on:
  push:
    branches: [main, dev, v3.x, v4.x]
    tags: ['v*']
  pull_request:
    branches: [main, dev, v3.x, v4.x]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }} deps
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer update resolves Laravel/Elasticsearch within the constraints
        # in composer.json for each PHP version. "lowest" pins the declared
        # floor so the minimum supported versions stay verified.
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest, lowest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        # composer.lock is not committed for a library, so skip the lock check.
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Verify PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Lint PHP sources
        run: find config src stubs tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

  security-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Audit runtime dependencies
        run: composer audit --no-dev --no-interaction

  elasticsearch-smoke:
    name: Laravel ${{ matrix.laravel_label }} / Elasticsearch ${{ matrix.elasticsearch_server }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            laravel_label: '12'
            testbench: '^10.0'
            elasticsearch_client: '^8.5'
            elasticsearch_server: '8.19.17'
          - php: '8.4'
            laravel: '^12.0'
            laravel_label: '12'
            testbench: '^10.0'
            elasticsearch_client: '^9.0'
            elasticsearch_server: '9.4.3'
          - php: '8.3'
            laravel: '^13.0'
            laravel_label: '13'
            testbench: '^11.0'
            elasticsearch_client: '^8.5'
            elasticsearch_server: '8.19.17'
          - php: '8.5'
            laravel: '^13.0'
            laravel_label: '13'
            testbench: '^11.0'
            elasticsearch_client: '^9.0'
            elasticsearch_server: '9.4.3'

    services:
      elasticsearch:
        image: 'docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch_server }}'
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.security.http.ssl.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --silent --fail 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"
          --health-interval 10s
          --health-timeout 6s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Select framework and Elasticsearch client
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "elasticsearch/elasticsearch:${{ matrix.elasticsearch_client }}" \
            --no-update --no-interaction
          composer update --prefer-dist --no-interaction

      - name: Run real Elasticsearch smoke test
        env:
          ELASTICSEARCH_INTEGRATION: '1'
          ELASTICSEARCH_URL: 'http://127.0.0.1:9200'
        run: vendor/bin/phpunit tests/Integration/ElasticsearchSmokeTest.php

  dashboard-assets:
    name: Dashboard asset build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated assets
        run: |
          npm run build
          git diff --exit-code -- public/vendor/elastic-audit
