name: Tests

on:
  push:
    branches: [main, dev, v3.x, v4.x]
  pull_request:
    branches: [main, dev, v3.x, v4.x]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }} deps
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer update resolves Laravel/Elasticsearch within the constraints
        # in composer.json for each PHP version. "lowest" pins the declared
        # floor so the minimum supported versions stay verified.
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest, lowest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        # composer.lock is not committed for a library, so skip the lock check.
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Verify PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Lint PHP sources
        run: find config src stubs tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

  dashboard-assets:
    name: Dashboard asset build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify generated assets
        run: |
          npm run build
          git diff --exit-code -- public/vendor/elastic-audit
